services:
  mmf:
    container_name: oss-mmf-ext-agl
    image: ${EXTAGL_IMG:-registry.obigo.com/oss/oss-mmf-ext-agl:latest}
    privileged: true
    network_mode: "host"
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - /dev/shm:/dev/shm
      - /run/user/1001:/run/user/1000
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_SOCK_GID:-999}"
    tty: true
    stdin_open: true
    restart: unless-stopped
