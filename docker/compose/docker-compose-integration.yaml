# DDS 도메인 (기본 42)
# ─────────────────────────────────────────────────────────────────────────────
# 이 파일의 모든 서비스는 `${ROS_DOMAIN_ID:-42}` 로 도메인을 받는다. 기본 42 인 이유는
# Autoware adsw 파티션(saved-service-list.yaml)이 42 라서다 — 0 이면 adsw_monitor 가
# 구독만 하고 발행자가 없어 화면이 전부 null 이 된다(실측 2026-08-04).
#
# 바꾸는 방법 (우선순위 순):
#   a) 도메인 파일 — HMI 런처 Settings 의 "DDS domain" 이 기록하는 정본:
#        docker compose --env-file /opt/mmf/config/domain.env \
#          -f docker/compose/docker-compose-integration.yaml up -d --force-recreate
#   b) 셸 env:  ROS_DOMAIN_ID=1 docker compose -f ... up -d
#   c) compose 파일 옆 `.env` (샘플: compose/domain.env.example)
#
# ⚠️ 도메인은 프로세스 시작 시점에만 읽힌다. `docker restart` 는 생성 당시 env 를
#    재사용하므로 **재생성(--force-recreate 또는 down+up)** 이 필요하다.
# ⚠️ 통합 테스트에서 도메인 격리가 필요하면 ROS_DOMAIN_ID 를 명시해 오버라이드한다
#    (예: ROS_DOMAIN_ID=7 docker compose ... — 기본값에 의존하지 말 것).

services:
  mmf-core:
    container_name: oss-mmf-core
    image: ${CORE_IMG:-registry.obigo.com/oss/oss-mmf-core:latest}
    privileged: true
    network_mode: "host"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - /dev/shm:/dev/shm
    #      - /run/user/1000:/run/user/1000
    restart: unless-stopped
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42} # DDS 도메인 격리 (보드별 동일 값 사용)
      - MMF_DDS_DOMAIN_ID=${ROS_DOMAIN_ID:-42} # raw Fast-DDS (lifecycle_mgr/diagnostics/adsw/ota)
      - VISS_DDS_DOMAIN_ID=${ROS_DOMAIN_ID:-42} # vehicle_info/viss
      - HEARTBEAT_INTERVAL_SEC=3
      - REST_URL=http://172.16.10.47:8080/upload
    healthcheck:
      test: [ "CMD-SHELL", "sleep 12" ]
      interval: 60s
      timeout: 15s
      retries: 1
      start_period: 12s

  mmf-ext-ros2:
    container_name: oss-mmf-ext-ros2
    image: ${EXTROS2_IMG:-registry.obigo.com/oss/oss-mmf-ext-ros2:latest}
    depends_on:
      mmf-core:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "sleep 2" ]
      interval: 60s
      timeout: 5s
      retries: 1
      start_period: 2s
    privileged: true
    network_mode: "host"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    cap_add:
      - NET_RAW
      - NET_ADMIN
    group_add:
      - "${DOCKER_GID:-999}" # adsw_manager가 docker run 실행에 필요
    volumes:
      - /dev/shm:/dev/shm
      #      - /run/user/1000:/run/user/1000
      - /var/run/docker.sock:/var/run/docker.sock # adsw_manager → 컨테이너 기동 필수
      # SAVED_SERVICE_LIST가 존재할 때만 전체 마운트 구문을 반환하고, 없으면 빈 문자열("")이 됨
      - ${SAVED_REGISTRY_BACKUP:-/dev/null}:/config
    restart: unless-stopped
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42} # DDS 도메인 격리
      - MMF_DDS_DOMAIN_ID=${ROS_DOMAIN_ID:-42} # raw Fast-DDS
      - SAVED_REGISTRY_BACKUP=${SAVED_REGISTRY_BACKUP:+/config} # 서비스목록 백업/설정 디렉토리 경로

  mmf-ext-agl:
    container_name: oss-mmf-ext-agl
    image: ${IMAGE:-registry.obigo.com/oss/oss-mmf-ext-agl:latest}
    # x86_64에서 hmi_launcher config 를 동적 생성한 뒤 원본 /oss/entrypoint.sh 를 실행
    # - GPU(nvidia/mesa/none) 는 마운트된 docker.sock 으로 컨테이너 내부에서 감지
    # - DISPLAY, HMI_RUNTIME_UID 는 아래 environment 에서 주입
    # - 생성 경로 /oss/bin/config/agl-service-list.x86.yaml 은 entrypoint 가 자동 선택
    entrypoint:
      - /bin/bash
      - -c
      - |
        if [ "$$(uname -m)" = "x86_64" ]; then
          GPU_ARGS=""
          gpu="$${HMI_GPU:-auto}"
          if [ "$$gpu" = "auto" ]; then
            if docker info 2>/dev/null | grep -qiE "Runtimes:.*nvidia|nvidia"; then
              gpu="nvidia"
            elif [ -e /dev/dri ]; then
              gpu="mesa"
            else
              gpu="none"
            fi
          fi
          case "$$gpu" in
            nvidia) GPU_ARGS=$$'  - "--gpus"\n  - "all"' ;;
            mesa)   GPU_ARGS=$$'  - "--device"\n  - "/dev/dri:/dev/dri"' ;;
            *)      GPU_ARGS="" ;;
          esac
          DISP="$${DISPLAY:-:0}"
          UIDN="$${HMI_RUNTIME_UID:-1000}"
          echo "[mmf-ext-agl] x86_64 hmi_launcher config 생성: gpu=$$gpu display=$$DISP uid=$$UIDN"
          cat > /oss/bin/config/agl-service-list.x86.yaml <<YAML
        services:
        - name: adsw_monitor
          service_type: NORMAL
          recovery_policy: ALWAYS
          is_enabled: true
          mw_type: AGL
          init_state: NOT_RUNNING
        - name: ota_monitor
          service_type: NORMAL
          recovery_policy: R_DEFAULT
          is_enabled: true
          mw_type: AGL
          init_state: NOT_RUNNING
        - name: lfc_monitor
          service_type: NORMAL
          recovery_policy: R_DEFAULT
          is_enabled: true
          mw_type: AGL
          init_state: NOT_RUNNING
        - name: hmi_launcher
          service_type: NORMAL
          recovery_policy: ALWAYS
          is_enabled: true
          mw_type: AGL
          init_state: NOT_RUNNING
          image: ${HMI_LAUNCHER_IMAGE:-registry.obigo.com/oss/oss-hmi-launcher:latest}
          extra_args:
          - "-it"
          - --net=host
          - --privileged
          - --restart
          - unless-stopped
          - --cap-add
          - NET_RAW
          - --cap-add
          - NET_ADMIN
        $${GPU_ARGS}
          - "-e"
          - DISPLAY=$${DISP}
          - "-e"
          - XDG_RUNTIME_DIR=/run/user/$${UIDN}
          - "-e"
          - LAUNCHER_BOT_ENABLED=0
          - "-v"
          - /tmp/.X11-unix:/tmp/.X11-unix
          - "-v"
          - /run/user/$${UIDN}:/run/user/$${UIDN}
          - "-v"
          - /usr/share/fonts:/usr/share/fonts:ro
          - "-v"
          - /etc/fonts:/etc/fonts:ro
        YAML
        fi
        exec /oss/entrypoint.sh
    privileged: true
    network_mode: "host"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    cap_add:
      - NET_RAW
      - NET_ADMIN
    group_add:
      - "${DOCKER_GID:-999}" # adsw_manager가 docker run 실행에 필요
    volumes:
      - /dev/shm:/dev/shm
      - /run/user/${HMI_RUNTIME_UID:-1000}:/run/user/1000
      - /var/run/docker.sock:/var/run/docker.sock # adsw_manager → hmi_launcher 등 닥커 제어에 필수
      # AGL 서비스 목록 오버라이드 필요 시 주석 해제
      # - ${AGL_SERVICE_LIST:-/opt/adsw/config/agl-service-list.yaml}:/oss/bin/config/agl-service-list.yaml:ro
      # x86_64 전용 hmi_launcher config: compose-up-agl.sh 실행 시 자동 주입됨
      # 직접 compose up 하는 경우: AGL_X86_CONFIG_GEN=/tmp/agl-service-list.x86.gen.yaml 을 지정
    restart: unless-stopped
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42} # DDS 도메인 격리
      - MMF_DDS_DOMAIN_ID=${ROS_DOMAIN_ID:-42} # raw Fast-DDS
      - HMI_RUNTIME_UID=${HMI_RUNTIME_UID:-1000}
      - HMI_GPU=${HMI_GPU:-auto}
      - DISPLAY=${DISPLAY:-:0}

  oss-adsw-decision:
    container_name: oss-adsw-decision-container
    image: ghcr.io/oss-test-group/autoware-partition:adsw-decision
    network_mode: "host"
    ipc: "host"
    privileged: true
    pid: host

    command: /autoware/start_script/adsw-decision.sh
    # command: bash -c "/exec/adsw-decision.sh && tail -f /dev/null"

    environment:
      - LOCAL_UID=${LOCAL_UID:-1000} # 실행 환경의 UID (컴포즈 가이드 참고)
      - LOCAL_GID=${LOCAL_GID:-1000} # 실행 환경의 GID
      - LOCAL_USER=${LOCAL_USER:-beyhpc} # 실행 환경의 사용자명
      - LOCAL_GROUP=${LOCAL_GROUP:-beyhpc} # 실행 환경의 그룹명
      - DISPLAY=${DISPLAY}
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      - XAUTHORITY=${XAUTHORITY}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}
      - NVIDIA_DRIVER_CAPABILITIES=all
      - TZ=Asia/Seoul # 타임존 직접 명시 (또는 호스트 환경에 맞춰 수정)
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42} # DDS 통신용 도메인 ID (필요시 변경)

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - .:/workspace
      - ~/autoware_map/KCity_map_251231:/autoware_map:ro
      - ~/autoware_exec:/exec
      - /etc/localtime:/etc/localtime:ro
      #- ~/oss/rosbag:/bag

      # 터미널 인터랙티브 모드 유지 (-it)
    stdin_open: true
    tty: true

    restart: unless-stopped

  oss-adsw-control:
    container_name: oss-adsw-control-container
    image: ghcr.io/oss-test-group/autoware-partition:adsw-control
    network_mode: "host"
    ipc: "host"
    privileged: true
    pid: host

    command: /autoware/start_script/adsw-control.sh
    # command: bash -c "/exec/adsw-decision.sh && tail -f /dev/null"

    environment:
      - LOCAL_UID=${LOCAL_UID:-1000} # 실행 환경의 UID (컴포즈 가이드 참고)
      - LOCAL_GID=${LOCAL_GID:-1000} # 실행 환경의 GID
      - LOCAL_USER=${LOCAL_USER:-beyhpc} # 실행 환경의 사용자명
      - LOCAL_GROUP=${LOCAL_GROUP:-beyhpc} # 실행 환경의 그룹명
      - DISPLAY=${DISPLAY}
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      - XAUTHORITY=${XAUTHORITY}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}
      - NVIDIA_DRIVER_CAPABILITIES=all
      - TZ=Asia/Seoul # 타임존 직접 명시 (또는 호스트 환경에 맞춰 수정)
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42} # DDS 통신용 도메인 ID (필요시 변경)

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - .:/workspace
      - ~/autoware_map/KCity_map_251231:/autoware_map:ro
      - ~/autoware_exec:/exec
      - /etc/localtime:/etc/localtime:ro
      #- ~/oss/rosbag:/bag

      # 터미널 인터랙티브 모드 유지 (-it)
    stdin_open: true
    tty: true

    restart: unless-stopped

  oss-adsw-perception:
    container_name: oss-adsw-perception-container
    image: ghcr.io/oss-test-group/autoware-partition:adsw-perception
    network_mode: "host"
    ipc: "host"
    privileged: true
    pid: host

    command: /autoware/start_script/adsw-perception.sh
    # command: bash -c "/exec/adsw-decision.sh && tail -f /dev/null"

    environment:
      - LOCAL_UID=${LOCAL_UID:-1000} # 실행 환경의 UID (컴포즈 가이드 참고)
      - LOCAL_GID=${LOCAL_GID:-1000} # 실행 환경의 GID
      - LOCAL_USER=${LOCAL_USER:-beyhpc} # 실행 환경의 사용자명
      - LOCAL_GROUP=${LOCAL_GROUP:-beyhpc} # 실행 환경의 그룹명
      - DISPLAY=${DISPLAY}
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      - XAUTHORITY=${XAUTHORITY}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}
      - NVIDIA_DRIVER_CAPABILITIES=all
      - TZ=Asia/Seoul # 타임존 직접 명시 (또는 호스트 환경에 맞춰 수정)
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42} # DDS 통신용 도메인 ID (필요시 변경)

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - .:/workspace
      - ~/autoware_map/KCity_map_251231:/autoware_map:ro
      - ~/autoware_exec:/exec
      - /etc/localtime:/etc/localtime:ro
      #- ~/oss/rosbag:/bag

      # 터미널 인터랙티브 모드 유지 (-it)
    stdin_open: true
    tty: true
    restart: unless-stopped

  oss-adsw-rviz:
    container_name: adsw-remote-rviz
    image: ${PARTITION_IMAGE_REPO:-ghcr.io/oss-test-group/autoware-partition}:adsw-perception
    network_mode: "host"
    ipc: "host"
    privileged: true
    command: rviz2 -d ${RVIZ_CONFIG:-/opt/autoware/share/obigo_launch/rviz/autoware.rviz}
    environment:
      - LOCAL_UID=${LOCAL_UID:-1000}
      - LOCAL_GID=${LOCAL_GID:-1000}
      - LOCAL_USER=${LOCAL_USER:-beyhpc}
      - LOCAL_GROUP=${LOCAL_GROUP:-beyhpc}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_LOCALHOST_ONLY=0
      - ROS_LOG_DIR=/tmp/.ros/log
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=${XAUTHORITY}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}
      - CYCLONEDDS_URI=${CYCLONEDDS_URI}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/shm:/dev/shm
      - /etc/localtime:/etc/localtime:ro
      - ${XAUTHORITY:-/dev/null}:${XAUTHORITY:-/dev/null}:ro
      - ${XDG_RUNTIME_DIR:-/dev/null}:${XDG_RUNTIME_DIR:-/dev/null}
    stdin_open: true
    tty: true
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────────────────────
  # rviz2-agl — AGL 보드(Orin)의 rviz2 컨테이너
  #
  # ⚠️ **`up` 으로 자동 기동되지 않는다** (profiles: [rviz2]). 이 컨테이너의 생명주기는
  #    런처의 rviz2_panel 이 소유한다 — 패널이 `docker run/stop/rm -f rviz2` 로 직접
  #    제어하고(F010 direct-docker), agl-shell gRPC(:14005) 로 화면을 전환한다.
  #    compose 가 부팅 때 함께 띄우면 ① 이름 충돌(패널 start 가 rm -f 로 지운다)
  #    ② rviz2 가 런처를 덮은 상태로 부팅되는 문제가 생긴다.
  #
  # 이 정의의 목적은 두 가지다:
  #   1) **이미지 프로비저닝** — 새 보드에서 패널 Start 전에 2GB 이미지를 미리 받는다:
  #        docker compose -f docker/compose/docker-compose-integration.yaml pull rviz2-agl
  #      (서비스를 이름으로 지목하면 해당 profile 이 자동 활성된다 — compose v2)
  #   2) **수동 스모크 실행** — 런처 없이 rviz2 만 띄워 확인할 때:
  #        docker compose -f ... --profile rviz2 up -d rviz2-agl
  #      확인 후에는 `docker stop rviz2 && docker rm rviz2` 로 정리해 패널에 넘긴다.
  #
  # 파라미터는 패널의 docker run 인자와 **동일**하게 유지한다
  # (oss_hmi_app: apps/rviz2_panel/lib/config/app_config.dart → dockerRunArgs).
  # 값이 갈라지면 "패널로 띄운 rviz2" 와 "compose 로 띄운 rviz2" 가 다르게 동작한다.
  # 의도적으로 다른 항목은 RVIZ_CONFIG 하나다: 패널은 기본 미설정(기본 rviz 뷰)이고
  # 사용자가 Run Options 에서 고르지만, 통합 테스트는 Autoware 시각화가 목적이라
  # 여기서는 autoware.rviz 를 기본값으로 준다(같은 파일의 oss-adsw-rviz 와 동일).
  # 기본 뷰로 띄우려면 RVIZ_CONFIG= (빈 값) 으로 오버라이드한다 — entrypoint 가
  # 빈 값이면 -d 를 붙이지 않는다.
  rviz2-agl:
    profiles: [ rviz2 ]
    container_name: rviz2            # 패널이 기대하는 이름 (docker stop/logs/inspect rviz2)
    image: ${RVIZ2_IMAGE:-registry.obigo.com/oss/rviz2-agl:latest}
    network_mode: "host"             # agl-shell gRPC 127.0.0.1:14005 접근
    ipc: "host"                      # ROS2 공유메모리 전송
    user: "1001:1001"                # agl-driver — wayland 소켓 소유자
    group_add: [ "44" ]              # video 그룹 (/dev/dri)
    environment:
      # 호스트 wayland 소켓을 컨테이너 안 경로로 넘긴다. entrypoint 가 소켓 존재를
      # 보고 cage 모드(보드)와 X11 직행 모드(x86 PC)를 자동 판정한다.
      - XDG_RUNTIME_DIR=/host-xdg
      - WAYLAND_DISPLAY=wayland-0
      - HOME=/tmp
      - LIBGL_ALWAYS_SOFTWARE=1      # Orin vendor GL 대신 SW 렌더 (실측 안정)
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
      - RVIZ_CONFIG=${RVIZ_CONFIG:-/opt/autoware/share/obigo_launch/rviz/autoware.rviz}
    volumes:
      - /run/user/1001:/host-xdg
    restart: "no"                    # 패널의 rm -f 와 싸우지 않게 재시작 정책 없음

  security_processor:
    image: ghcr.io/oss-test-group/oss-ids/security_processor:v0.1.0
    container_name: security_processor
    restart: unless-stopped
    network_mode: host
    ipc: host
    depends_on:
      mmf-ext-ros2:
        condition: service_healthy

  attack_env:
    image: ghcr.io/oss-test-group/oss-ids/attack_env:v0.1.0
    container_name: attack_env
    restart: unless-stopped
    network_mode: host
    ipc: host
    depends_on:
      mmf-ext-ros2:
        condition: service_healthy

  security_monitor:
    image: ghcr.io/oss-test-group/oss-ids/security_monitor:v0.1.0
    container_name: security_monitor
    restart: unless-stopped
    network_mode: host
    ipc: host
    volumes:
      - monitor_db:/app/data
    depends_on:
      mmf-ext-ros2:
        condition: service_healthy
      attack_env:
        condition: service_started

volumes:
  monitor_db:
