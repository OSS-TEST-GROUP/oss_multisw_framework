# Orin(arm64) 실보드용 compose 오버라이드 — docker-compose-integration.yaml 과 함께 쓴다.
#
#   docker compose -f docker/compose/docker-compose-integration.yaml \
#                  -f docker/compose/docker-compose-agl-board.override.yaml \
#                  up -d mmf-ext-agl
#
# 보드 런타임 uid 는 1001(agl-driver) 이므로 HMI_RUNTIME_UID=1001 로 실행한다:
#   HMI_RUNTIME_UID=1001 docker compose -f … -f … up -d mmf-ext-agl
# (보드에서는 /etc/oss/compose/board.env 가 HMI_RUNTIME_UID·DOCKER_GID 를 준다)
#
# ── AGL 서비스 목록의 정본은 **컨테이너 이미지**다 (2026-09-07 변경) ──────────
#
# 예전에는 이 파일이 호스트 목록을 이미지 사본 위에 마운트했다:
#   - ${AGL_SERVICE_LIST:-/opt/adsw/config/agl-service-list.yaml}:/oss/bin/config/agl-service-list.yaml:ro
#
# 그 마운트를 **제거했다.** 이유(보드 81 실측 2026-09-07):
#   · 마운트가 있으면 목록의 정본이 이미지 밖으로 나가 **컨테이너를 업데이트해도
#     목록이 반영되지 않는다.** 실제로 이미지에서 monitor 앱 3종을 지우고 배포했는데
#     보드는 옛 목록을 계속 썼다.
#   · 게다가 호스트 파일은 Yocto 패키지(oss-integration-compose)가 싣고
#     `/usr/bin/oss-provision` 이 기본 `MODE=full` 로 되살린다 → 이미지 수정이
#     프로비저닝 한 번에 되돌아간다.
#
# 마운트가 필요했던 이유는 목록에 **보드별 값**이 하드코딩돼 있었기 때문이다.
# 그 값들만 환경변수로 뺐으므로(목록은 `${DOCKER_GID:-999}` /
# `${HMI_RUNTIME_UID:-1001}` 를 참조, adsw_manager 가 로드 시 확장) 목록 자체는
# 모든 보드에서 동일해지고 이미지에 담을 수 있다.
#   - DOCKER_GID       → 런처의 --group-add (docker.sock 접근; rviz2_panel 제어용)
#   - HMI_RUNTIME_UID  → /run/user/<uid> (Wayland 소켓), XDG_RUNTIME_DIR
# 나머지 항목(/root/oss/hmi_launcher_config.json 의 rosbridge URL, /cfg,
# /opt/mmf/config 도메인 파일)은 **경로가 보드마다 같고 내용만 다르므로** 목록을
# 손댈 필요가 없다.
#
# 목록을 보드에서 임시로 바꿔야 하면 이미지를 가리지 말고 ADSW_CONFIG 로 지정한다
# (main.cpp 의 우선순위: --config > ADSW_CONFIG > 이미지 내장 경로):
#   ADSW_CONFIG=/opt/adsw/config/my-list.yaml docker compose … up -d mmf-ext-agl
# 그래야 "가림"이 기본값이 아니라 **명시적 예외**로 남는다.
services:
  mmf-ext-agl:
    # base 의 `deploy`(nvidia GPU 예약)를 **제거**한다 — Compose 2.24+ 의 `!reset` 태그.
    # Orin/AGL 보드의 docker 에는 "nvidia" device driver 가 등록돼 있지 않아(실측:
    # Runtimes = runc 뿐) 그대로 두면 컨테이너 생성이 다음으로 거부된다:
    #   Error response from daemon: could not select device driver "nvidia" with capabilities: [[gpu]]
    # `devices: []` 로는 지워지지 않는다 — compose 가 빈 시퀀스를 "미설정"으로 보고 base 값을
    # 유지하기 때문이다(보드 실측 2026-08-06). `!reset` 이 이 용도의 공식 문법이다.
    # 보드에서 GPU 는 ext-agl 이 아니라 **런처 컨테이너**가 AGL 서비스 목록의
    # `--device /dev/dri:/dev/dri` 로 얻으므로 이 예약은 불필요하다.
    # x86 데스크탑(nvidia 런타임 보유)은 이 override 를 쓰지 않아 base 그대로 GPU 를 쓴다.
    deploy: !reset null
