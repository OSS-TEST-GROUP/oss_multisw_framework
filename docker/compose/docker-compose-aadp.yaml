services:
  mmf-core:
    container_name: oss-mmf-core
    image: ${CORE_IMG:-registry.obigo.com/oss/oss-mmf-core:latest}
    privileged: true
    network_mode: "host"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - /dev/shm:/dev/shm
      - /run/user/1000:/run/user/1000
    restart: unless-stopped

  mmf-ext-ros2:
    container_name: oss-mmf-ext-ros2
    image: ${EXTROS2_IMG:-registry.obigo.com/oss/oss-mmf-ext-ros2:latest}
    privileged: true
    network_mode: "host"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - /dev/shm:/dev/shm
      - /run/user/1000:/run/user/1000
    restart: unless-stopped
