apiVersion: v1
kind: Pod
metadata:
  name: ros2-hello-all
spec:
  containers:
    - name: ros2-hello-app
      image: ros2-hello:latest  # Your own hello_app image
      imagePullPolicy: Never
      command: ["/bin/bash", "-c"]
      args:
        [" ros2 run ros2_test_1 /ros2_hello subscriber -t 2 -s 1 & \
           ros2 run ros2_test_2 /ros2_hello publisher -t 2 -s 1 -m 1 & \
           ros2 run ros2_test_3 /ros2_hello publisher -t 0 -s 3 -m 1 & \
           ros2 run ros2_test_4 /ros2_hello subscriber -t 0 -s 3 && \
           wait"
        ]
      env:
        - name: ROS_DOMAIN_ID
          value: "1"
  restartPolicy: Never