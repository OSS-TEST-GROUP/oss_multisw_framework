# SiLS QoS Catalog — 아키텍처 §9.3
#
# endpoint 마다 QoS 를 반복하지 않고 여기서 참조한다.
# viss-default 는 현재 VISS DDS transport 가 TOPIC_QOS_DEFAULT 를 쓰는 것에 대응하는
# "후보" 값이다. Fast DDS 기본 RxO(Writer=RELIABLE, Reader=BEST_EFFORT 등)와 실제
# 매칭 여부는 Phase 0A Contract Spike 에서 실측해 확정한다.

viss-default:
  reliability: RELIABLE            # TODO(0A): /VIN/Vehicle 실측으로 확정
  durability: VOLATILE
  history: { kind: KEEP_LAST, depth: 10 }

request-reliable:
  reliability: RELIABLE
  durability: VOLATILE
  history: { kind: KEEP_LAST, depth: 10 }

state-latest:
  reliability: RELIABLE
  durability: TRANSIENT_LOCAL
  history: { kind: KEEP_LAST, depth: 1 }
