name: 🐛 버그 제보 · Bug Report
description: 동작하지 않거나 예상과 다른 문제를 신고합니다. / Report something broken or behaving unexpectedly.
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        버그 제보 감사합니다. 재현에 필요한 정보를 최대한 채워 주세요. 사용법·설치 문의 등 버그가 아닌 질문은 Discussions Q&A 를 이용해 주세요.
        Thanks for the report! Please fill in as much as you can. For usage/installation questions (not bugs), please use Discussions Q&A.

  - type: checkboxes
    id: preflight
    attributes:
      label: 사전 확인 · Preflight
      options:
        - label: 기존 이슈에서 동일한 버그가 보고되지 않았는지 검색했습니다. / I searched existing issues for duplicates.
          required: true
        - label: 최신 릴리스(또는 develop)에서도 재현되는 문제입니다. / It reproduces on the latest release (or develop).
          required: false

  - type: dropdown
    id: component
    attributes:
      label: 관련 컴포넌트 · Component
      description: 문제가 발생한 영역을 선택하세요. / Select where the problem occurs.
      options:
        - vehicle_info_mgr
        - "ota_mgr (OtaManager)"
        - lifecycle_mgr
        - diagnostics
        - "adsw_manager (ROS2 확장 / extension)"
        - "adsw_manager (AGL 확장 / extension)"
        - ota_client
        - "빌드·CI / Build·CI"
        - "DDS·IDL"
        - "기타·모름 / Other·Unknown"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 예상 동작 · Expected behavior
      description: 무엇이 일어나야 했나요? / What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작 · Actual behavior
      description: 실제로 무엇이 일어났나요? / What actually happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 절차 · Steps to reproduce
      description: 문제를 재현할 수 있는 단계를 순서대로 적어주세요. / List the steps to reproduce, in order.
      placeholder: |
        1. ...
        2. ...
        3. 오류 발생 / error occurs
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 버전 · Version
      description: 사용 중인 릴리스 버전 또는 커밋 SHA / Release version or commit SHA in use
      placeholder: 예/e.g. v1.0.0, abc1234
    validations:
      required: true

  - type: dropdown
    id: build-target
    attributes:
      label: 빌드 타깃 · Build target
      description: 해당되는 아키텍처(복수 선택 가능) / Applicable architecture(s)
      multiple: true
      options:
        - x86_64
        - aarch64
    validations:
      required: false

  - type: dropdown
    id: extension
    attributes:
      label: 확장 플랫폼 · Extension platform
      multiple: true
      options:
        - ROS2
        - AGL
        - "해당 없음 / N/A"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 관련 로그 / 오류 출력 · Logs
      description: 관련 로그나 스택 트레이스를 붙여넣어 주세요. (자동으로 코드 형식으로 표시됩니다) / Paste relevant logs or stack traces (rendered as code).
      render: shell
    validations:
      required: false
