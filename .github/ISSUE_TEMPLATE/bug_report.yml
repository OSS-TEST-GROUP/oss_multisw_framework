name: 🐛 버그 제보 (Bug Report)
description: 동작하지 않거나 예상과 다른 문제를 신고합니다.
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        버그 제보 감사합니다. 재현에 필요한 정보를 최대한 채워 주세요.
        사용법·설치 문의 등 버그가 아닌 질문은 Discussions Q&A 를 이용해 주세요.

  - type: checkboxes
    id: preflight
    attributes:
      label: 사전 확인
      options:
        - label: 기존 이슈에서 동일한 버그가 보고되지 않았는지 검색했습니다.
          required: true
        - label: 최신 릴리스(또는 develop)에서도 재현되는 문제입니다.
          required: false

  - type: textarea
    id: what-happened
    attributes:
      label: 무슨 일이 있었나요?
      description: 발생한 문제와 기대했던 동작을 함께 설명해 주세요.
      placeholder: 무엇을 했고, 무엇을 기대했으며, 실제로 어떻게 되었는지 적어주세요.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      description: 문제를 재현할 수 있는 단계를 순서대로 적어주세요.
      placeholder: |
        1. ...
        2. ...
        3. 오류 발생
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 버전
      description: 사용 중인 릴리스 버전 또는 커밋 SHA
      placeholder: 예) v1.0.0 또는 abc1234
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 운영체제
      multiple: true
      options:
        - Linux
        - Windows
        - macOS
        - 기타
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 관련 로그 / 오류 출력
      description: 관련 로그나 스택 트레이스를 붙여넣어 주세요. (자동으로 코드 형식으로 표시됩니다)
      render: shell
    validations:
      required: false
