# 이슈 템플릿 선택 화면 설정 / Issue template chooser config
# 빈 이슈를 막고, 버그가 아닌 질문은 Discussions 로 유도한다.
# Block blank issues; route non-bug questions to Discussions.
blank_issues_enabled: false
contact_links:
