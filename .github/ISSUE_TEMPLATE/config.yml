  - name: 💡 아이디어 / 자유 토론 · Ideas
    url: https://github.com/orgs/OSS-TEST-GROUP/discussions/categories/ideas
    about: 방향이 정해지지 않은 제안·토론은 Discussions Ideas 를 이용해 주세요. / For open-ended proposals or discussion, use Discussions Ideas.
  - name: 🔒 보안 취약점 신고 · Security
    url: https://github.com/OSS-TEST-GROUP/oss_multisw_framework/security/advisories/new
    about: 보안 취약점은 공개 이슈가 아니라 비공개 신고 채널로 알려주세요. / Report security vulnerabilities privately, not as public issues.
