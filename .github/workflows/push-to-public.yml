# =============================================================================
# 사내 → Public 코드 전달 워크플로
# 배치 위치: 사내 저장소 obigo-gov/oss_multisw_framework
#            .github/workflows/push-to-public.yml
#
# 흐름: publish/* 브랜치 push (또는 수동 트리거)
#        → build / test / security-scan (내부 CI)
#        → publish-approval (공개 승인 게이트: Environment required reviewers)
#        → 봇 계정으로 공개 저장소(OSS-TEST-GROUP)에 feature/* 로 push
#        → 공개 저장소에 PR 자동 생성 (feature/* → develop)
#
# 정책 근거: 오픈소스 운영정책 §5 (방법 1 + 파이프라인 자동 push)
# =============================================================================

name: Push to Public

on:
  push:
    branches:
      - 'publish/**'        # 공개 준비 완료 신호
  workflow_dispatch:         # 담당자 수동 트리거
    inputs:
      branch:
        description: '공개할 사내 브랜치 (예: publish/my-feature)'
        required: true

# 공개 저장소 좌표
env:
  PUBLIC_REMOTE: https://github.com/OSS-TEST-GROUP/oss_multisw_framework.git
  PUBLIC_OWNER: OSS-TEST-GROUP
  PUBLIC_REPO: oss_multisw_framework
  PUBLIC_BASE: develop      # 공개 저장소 정본(기본) 브랜치

# 동일 브랜치의 중복 실행 방지
concurrency:
  group: push-to-public-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1) 내부 CI: 빌드 / 테스트 / 보안 스캔
  #    실제 빌드·테스트 명령은 프로젝트에 맞게 교체하세요.
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          echo "TODO: 프로젝트 빌드 명령"
          # 예) ./gradlew build  /  make  /  npm ci && npm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          echo "TODO: 테스트 명령"
          # 예) ./gradlew test  /  pytest  /  npm test

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret / dependency scan
        run: |
          echo "TODO: 시크릿·의존성 취약점 스캔"
          # 예) gitleaks detect --source . --no-banner
          #     trivy fs --exit-code 1 .

  # ---------------------------------------------------------------------------
  # 2) 공개 승인 게이트
  #    GitHub Environment 'publish-approval' 에 required reviewers 를 설정하면,
  #    이 job 에서 실행이 '대기' 상태로 멈추고 지정된 승인자가 승인해야 진행됩니다.
  #    (보안심의·기관 공개승인 담당자를 reviewers 로 지정)
  # ---------------------------------------------------------------------------
  publish-approval:
    needs: [build, test, security-scan]
    runs-on: ubuntu-latest
    environment: publish-approval    # ← 승인 게이트가 걸리는 지점
    steps:
      - name: Approval recorded
        run: echo "공개 승인 완료 — Public push 로 진행합니다."

  # ---------------------------------------------------------------------------
  # 3) 공개 저장소로 push + PR 생성
  # ---------------------------------------------------------------------------
  push-to-public:
    needs: [publish-approval]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 전체 히스토리 필요

      - name: Resolve source branch
        id: src
        run: |
          # push 트리거면 github.ref_name, 수동 트리거면 입력값 사용
          if [ -n "${{ github.event.inputs.branch }}" ]; then
            SRC="${{ github.event.inputs.branch }}"
          else
            SRC="${{ github.ref_name }}"
          fi
          # publish/foo → 공개 저장소의 feature/foo 로 매핑
          DST="feature/${SRC#publish/}"
          echo "src=$SRC" >> "$GITHUB_OUTPUT"
          echo "dst=$DST" >> "$GITHUB_OUTPUT"
          echo "공개 대상: $SRC → $PUBLIC_OWNER/$PUBLIC_REPO:$DST"
          
      - name: Debug token length (임시)
        env:
          PUBLIC_BOT_TOKEN: ${{ secrets.PUBLIC_BOT_TOKEN }}
        run: |
          echo "token length: ${#PUBLIC_BOT_TOKEN}"
          echo "prefix: ${PUBLIC_BOT_TOKEN:0:10}"

      - name: Push to public (feature branch only)
        env:
          # 봇 계정 PAT (공개 저장소 feature/* push 권한). Secrets 에 등록.
          PUBLIC_BOT_TOKEN: ${{ secrets.PUBLIC_BOT_TOKEN }}
        run: |
          SRC="${{ steps.src.outputs.src }}"
          DST="${{ steps.src.outputs.dst }}"
          # 토큰을 URL 에 끼워 인증 (로그에 노출되지 않도록 origin 별칭 사용)
          git remote add public "https://x-access-token:${PUBLIC_BOT_TOKEN}@github.com/${PUBLIC_OWNER}/${PUBLIC_REPO}.git"
          git checkout "$SRC"
          # 공개 저장소의 feature/* 로만 push (develop 직접 push 금지)
          git push public "HEAD:${DST}"

      - name: Create PR on public repo
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_BOT_TOKEN }}
        run: |
          DST="${{ steps.src.outputs.dst }}"
          # 이미 열린 PR 이 없으면 생성 (feature/* → develop)
          gh pr create \
            --repo "${PUBLIC_OWNER}/${PUBLIC_REPO}" \
            --base "${PUBLIC_BASE}" \
            --head "${DST}" \
            --title "[contrib] ${DST}" \
            --body "사내(obigo-gov)에서 공개 준비 완료되어 전달된 기능입니다. 리뷰 후 선별 머지 바랍니다." \
            || echo "PR 이 이미 존재하거나 생성을 건너뜁니다."
          # 주의: 머지는 자동화하지 않습니다. CODEOWNERS 리뷰 후 담당자가 수동 머지.
