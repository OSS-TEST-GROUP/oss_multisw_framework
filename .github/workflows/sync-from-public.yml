# =============================================================================
# Public → 사내 동기화 워크플로 (tracking, fast-forward only)
# 배치 위치: 사내 저장소 obigo-gov/oss_multisw_framework
#            .github/workflows/sync-from-public.yml
#
# 역할: 공개 저장소(OSS-TEST-GROUP)의 develop(정본)에 머지된 모든 변경을
#       사내 tracking 브랜치로 fast-forward 수신한다.
#       사내 기능·외부 기여 구분 없이, 공개에 머지된 결과가 여기로 들어온다.
#
# 안전장치: --ff-only 로만 병합한다. 사내 tracking 이 공개와 갈라졌다면
#           (누군가 tracking 에 직접 커밋) 병합이 실패하고 job 이 에러로 멈춘다.
#           → "정본은 Public" 규칙 위반을 시스템이 잡아낸다.
#
# 정책 근거: 오픈소스 운영정책 §7 (Public → 사내 동기화)
# =============================================================================

name: Sync from Public (tracking)

on:
  schedule:
    - cron: '0 */6 * * *'    # 6시간마다 (UTC 기준). 필요시 조정
  workflow_dispatch:          # 담당자 수동 실행

env:
  PUBLIC_OWNER: OSS-TEST-GROUP
  PUBLIC_REPO: oss_multisw_framework
  PUBLIC_BASE: develop        # 공개 정본 브랜치
  TRACKING_BRANCH: tracking   # 사내 추종 브랜치

concurrency:
  group: sync-from-public
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # 사내 tracking 브랜치에 push 하기 위함
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # 전체 히스토리 필요
          ref: ${{ env.TRACKING_BRANCH }}   # tracking 브랜치 체크아웃

      - name: Fetch public
        env:
          # 공개 저장소가 아직 private 이거나 rate limit 회피용. public 이면 없어도 fetch 가능.
          PUBLIC_BOT_TOKEN: ${{ secrets.PUBLIC_BOT_TOKEN }}
        run: |
          git remote add public "https://oauth2:${PUBLIC_BOT_TOKEN}@github.com/${PUBLIC_OWNER}/${PUBLIC_REPO}.git"
          # 이 fetch 에서만 checkout 이 심은 extraheader(사내 GITHUB_TOKEN)를 무력화.
          # (전역 unset 하면 이후 origin push 인증이 깨지므로 -c 로 이 명령에만 적용)
          git -c http.https://github.com/.extraheader= fetch public --tags

      - name: Fast-forward merge (ff-only)
        id: merge
        run: |
          git checkout "${TRACKING_BRANCH}"
          # ff-only: 공개가 앞서 있으면 그대로 따라가고, 갈라졌으면 실패
          if git merge --ff-only "public/${PUBLIC_BASE}"; then
            echo "동기화 성공: public/${PUBLIC_BASE} → ${TRACKING_BRANCH}"
          else
            echo "::error::ff-only 병합 실패 — 사내 ${TRACKING_BRANCH} 가 공개 정본과 갈라졌습니다."
            echo "::error::누군가 ${TRACKING_BRANCH} 에 직접 커밋했을 가능성이 높습니다. (정책 §7 위반)"
            exit 1
          fi

      - name: Push to internal tracking
        run: |
          git push origin "${TRACKING_BRANCH}"

      # 실패 시 알림 (예: Slack). 사내 규칙 위반을 담당자가 즉시 인지하도록.
      - name: Notify on failure
        if: failure()
        run: |
          echo "TODO: 실패 알림 연동 (Slack/메일 등)"
          # 예) curl -X POST -H 'Content-type: application/json' \
          #       --data '{"text":"[oss_multisw_framework] tracking 동기화 실패 — 규칙 위반 점검 필요"}' \
          #       "${{ secrets.SLACK_WEBHOOK_URL }}"
