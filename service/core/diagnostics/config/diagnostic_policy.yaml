diagnosic_policies:
  - code : 10
    name : lifecyclemanager
    rules :
      - status : "FATAL"
        message : "All services are not alive."
        condition_operator : "AND"
        condition :
          - "LifecycleDiagReport.is_started = true"
          - "LifecycleDiagReport.total_services_num > 0"
          - "LifecycleDiagReport.running_service_num = 0"
      - status : "WARNING"
        message : "At least one service is not alive."
        condition_operator : "AND"
        condition :
          - "LifecycleDiagReport.is_started = true"
          - "LifecycleDiagReport.running_service_num < LifecycleDiagReport.total_services_num"
      - status : "PASS"
        message : "All services are running."
        condition_operator : "AND"
        condition :
          - "LifecycleDiagReport.is_started = true"
          - "LifecycleDiagReport.running_service_num = LifecycleDiagReport.total_services_num"
    active : true
  - code : 11
    name : otamanager
    rules :
      - status : "WARNING"
        message : "OTA manager service error detected."
        condition_operator : "AND"
        condition :
          - "NotifyOtaMgrInfo.err_code != 1"
      - status : "PASS"
        message : "OTA manager service success."
        condition_operator : "AND"
        condition :
          - "NotifyOtaMgrInfo.err_code = 1"
    active : true
refer_messages:
  - name : LifecycleDiagReport
    message : mmf/lifecyclemgr/LifecycleDiagReport
    protocol : dds
  - name : NotifyOtaMgrInfo
    message : /mmf/otamanager/diagnostic_service/NotifyOtaMgrInfo
    protocol : dds
