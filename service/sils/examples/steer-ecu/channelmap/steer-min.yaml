# steer-ecu channel map -- Steering ECU (MORAI/AWSIM plant coupling, Option 2).
# See docs/sils-morai-plant-adapter-design.md and service/sils/vecu/src/channel_map.hpp.
#
# Same shape as the SDK's config/sils/channelmap/ego-min.yaml (EgoState in, VehicleControl
# out) -- a steering ECU differs by its BEHAVIOR, not its wire. The ACTUATION topic is
# distinct (sils/ego/steer_cmd) so a steering ECU and a longitudinal ECU can coexist on the
# bus, each publishing its own actuation channel.
#
# Run:  SILS_CHANNELMAP=service/sils/examples/steer-ecu/channelmap/steer-min.yaml \
#       STEER_SETPOINT=0.1  bin/steer_ecu
channels:
  # --- STATE in (MORAI/AWSIM -> vECU): EgoState struct ---
  - name: Vehicle.EgoState
    dir: in
    topic: sils/ego/state
    type: canonical/ego-state

  # --- ACTUATION out (vECU -> MORAI/AWSIM): VehicleControl struct (steering) ---
  - name: Vehicle.Chassis.Steering
    dir: out
    topic: sils/ego/steer_cmd
    type: canonical/vehicle-control
