      # ── 로컬 테스트용 샘플 컨테이너 (adsw-test-app:latest 이미지 필요) ──
      # 이미지 빌드: docker build -t adsw-test-app:latest unittest/docker/
  - name: adsw-test-docker
    image: "adsw-test-app:latest"
    container-type: "docker"
    services:
    - package: "test_pkg"
      name: "test_service"
      launchfile: ""
      type: "NORMAL"
      # ALWAYS would create an infinite restart loop: the image lacks
      # test_pkg so ros2-run dies immediately, the per-PID monitor reports
      # NOT_RUNNING within 3s, lifecycle_mgr re-issues StartService, repeat.
      # MANUAL stops after the first attempt — operator drives restart
      # explicitly from lfc_monitor.
      recovery: "MANUAL"
      enabled: "true"
      max: "0"



