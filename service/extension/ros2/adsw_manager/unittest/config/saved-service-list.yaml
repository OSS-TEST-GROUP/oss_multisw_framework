version: 0.1
specs:
  - containers:
      - name: autoware
        image: "your-docker-registry/autoware:latest"  # Use your Autoware build with all required components
        deploy-filepath: "partition_ros2_test.yaml"  # container apply pod file
        services:
          - package: "<YOUR_VEHICLE_SENSOR_LAUNCH_PKG>"
            name: "sensing"
            launchfile: "sensing.launch.xml"
            type: "NORMAL"
            recovery: "MANUAL"
            enabled: "true"
            max: "0"
          - package: "<YOUR_VEHICLE_INTERFACE_LAUNCH_PKG>"
            name: "vehicle_interface"
            launchfile: "vehicle_interface.launch.xml"
            type: "NORMAL"
            recovery: "MANUAL"
            enabled: "true"
            max: "0"
          - package: "autoware_launch"
            name: "map_launch"
            launchfile: "map.launch.xml"
            type: "NORMAL"
            recovery: "MANUAL"
            enabled: "true"
            max: "0"
      - name : oss-mmf-ext-ros2
        image: "oss-mmf-ext-ros2:latest"  # Your own sample_app image
        deploy-filepath: "oss-mmf-ext-ros2-speclist.yaml"  # container apply
        services:
          - package: "ota_client"
            name: "ota_client"
            launchfile: ""
            type: "NORMAL"
            recovery: "ALWAYS"
            enabled: "true"
            max: "0"
          - package: "security_client"
            name: "security_client"
            launchfile: ""
            type: "NORMAL"
            recovery: "ALWAYS"
            enabled: "true"
            max: "0"



