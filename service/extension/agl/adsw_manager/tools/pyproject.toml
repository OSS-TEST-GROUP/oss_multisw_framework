[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agl-adsw-config"
version = "0.1.0"
description = "CLI tool for managing AGL ADSW service configuration (agl-service-list.yaml)"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "ruamel.yaml>=0.18",
    "rich>=13.0",
    "pydantic>=2.0",
]

[project.scripts]
agl-adsw-config = "agl_adsw_config.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["agl_adsw_config*"]
