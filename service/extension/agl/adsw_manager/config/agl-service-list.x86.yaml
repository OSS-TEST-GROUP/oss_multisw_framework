services:
# ── 인프라 컨테이너 (관찰 전용) ────────────────────────────────────────────
# oss-hmi-launcher 처럼 lfc_monitor 에 카드로 보이게 한다. 다만 **수명은 호스트가
# 소유**한다 (run-ext-agl.sh / compose 가 만든다) → observe_only: true.
#   · image 가 있어야 컨테이너 카드로 발행되고(MessageTransmitter::PublishContainerState)
#     ServiceMonitor 가 `docker inspect -f {{.State.Running}}` 로 실상태를 읽는다
#   · observe_only 가 CanControlApp 을 막아 자동복구/시작/정지를 모두 거부한다.
#     ext-agl 은 adsw_manager **자신이 도는 컨테이너**라 stop 은 자살이고,
#     자동복구는 호스트 인자 대신 이 yaml 인자로 다른 컨테이너를 만들어 버린다.
# ⚠️ 호스트가 다르면 보이지 않는다 — `docker inspect` 는 이 컨테이너의 docker.sock,
#    즉 **같은 호스트**만 본다. oss-mmf-core / oss-mmf-ext-ros2 는 151 에서 돌므로
#    ext-ros2 쪽 saved-service-list.yaml 에 등록한다(여기 넣으면 항상 NOT_RUNNING).
- name: oss-mmf-ext-agl
  service_type: NORMAL
  recovery_policy: MANUAL
  is_enabled: true
  mw_type: AGL
  init_state: RUNNING
  image: registry.obigo.com/oss/oss-mmf-ext-agl:latest
  observe_only: true
# adsw_monitor / ota_monitor / lfc_monitor 는 **관리 대상이 아니다** (2026-09-07 제거).
# 이 셋은 hmi_launcher 안에서 실행되는 화면(앱)이지 독립 서비스가 아니다. 등록만 돼
# 있었고 `image`/`command_args` 가 없어 adsw_manager 는 이들을 **애초에 기동할 수
# 없었다** — 그런데 adsw_monitor 는 `recovery_policy: ALWAYS` 라 복구 정책이 끝없이
# 재시도를 걸었다. 그 실패는 ctrl/StartServiceResponse 로 흘러 lfc_monitor Events 에
# `ctrl start svc FAILED` 로만 찍혔고, CtrlResponse 에는 대상 이름 필드가 없어
# **어느 서비스인지 알 수 없었다**(보드 81 실측 2026-09-07).
# rviz2 와 같은 취급 — 아래 주석 참조.
# amd64(x86_64) 전용 hmi_launcher — GTK/X11 런타임.
# arm64 보드용(agl-service-list.yaml)의 flutter-auto/Wayland 인자 대신 X11 을 쓴다.
#   - flutter-auto 마운트(/usr/share/flutter) 제거 (GTK 번들은 자체 포함)
#   - command_args 없음 (amd64 entrypoint /app/entrypoint 가 곧 hmi_launcher 바이너리)
#   - Wayland(/run/user/1001) 대신 X11 (/tmp/.X11-unix + DISPLAY)
#   - /root/oss/hmi_launcher_config.json 마운트 제거 → 이미지 baked launcher_config
#     (ws://localhost:9090) 사용. 보드/원격 rosbridge 는 mounted ADSW_CONFIG 로 오버라이드.
#   - --gpus all: x86 데스크톱 X 서버는 대개 NVIDIA GLX 를 쓰므로 nvidia GPU 접근이
#     없으면 GLX 오류(BadValue request_code 152)로 크래시한다(DOCKER_GUIDE 참조).
#     ⚠ nvidia-container-toolkit 필요. NVIDIA 아닌 PC(Intel/AMD mesa)는 이 파일을
#       복사해 `--gpus all` 을 `--device /dev/dri:/dev/dri` 로 바꿔 ADSW_CONFIG 로
#       마운트한다(재빌드 불필요).
# 전제: 표준 단일 디스플레이 NVIDIA 데스크톱(DISPLAY=:0, uid 1000) +
#       호스트에서 `xhost +local:` (run-ext-agl.sh 가 자동 실행).
- name: hmi_launcher
  service_type: NORMAL
  recovery_policy: ALWAYS
  is_enabled: true
  mw_type: AGL
  init_state: NOT_RUNNING
  # 기본은 :latest. 특정 빌드로 고정해야 하면 이 파일을 복사해 image 를 바꾸고
  # ADSW_CONFIG 로 마운트한다(재빌드 불필요).
  image: registry.obigo.com/oss/oss-hmi-launcher:latest
  extra_args:
  - "-it"
  - --net=host
  - --privileged
  - --restart
  - unless-stopped
  - --cap-add
  - NET_RAW
  - --cap-add
  - NET_ADMIN
  - --gpus
  - all
  - "-e"
  - DISPLAY=:0
  - "-e"
  - XDG_RUNTIME_DIR=/run/user/1000
  - "-e"
  - LAUNCHER_BOT_ENABLED=0
  - "-v"
  - /tmp/.X11-unix:/tmp/.X11-unix
  - "-v"
  - /run/user/1000:/run/user/1000
  - "-v"
  - /usr/share/fonts:/usr/share/fonts:ro
  - "-v"
  - /etc/fonts:/etc/fonts:ro
  # 런처 사용자 설정(앱 표시/숨김 = app_visibility.json, 타임존 등) 영속화.
  # XDG_CONFIG_HOME 미설정이면 HOME 으로 떨어져 **컨테이너 재생성마다 초기화**된다
  # (기본 숨김 앱을 켜 놓아도 재시작하면 사라짐). arm64 와 동일한 처리.
  # x86 런처 컨테이너는 root(uid 0)로 돌므로 arm64 의 uid 1001 소유권 요구는 없다.
  #   준비: mkdir -p /opt/mmf/hmi_launcher_cfg
  - "-v"
  - /opt/mmf/hmi_launcher_cfg:/cfg:rw
  - "-e"
  - XDG_CONFIG_HOME=/cfg
  # DDS 도메인 정본 파일. 런처 Settings 의 "DDS domain"(기본 42)이 여기에 기록하고,
  # run-mmf.sh / run-ext-agl.sh 가 기동 시 읽는다 → 변경은 **다음 기동 때** 반영된다.
  # run-ext-agl.sh 의 MMF_DOMAIN_ENV_FILE 기본값(/opt/mmf/config/domain.env)과 같은 경로다.
  #   준비: mkdir -p /opt/mmf/config
  - "-v"
  - /opt/mmf/config:/mmf-config:rw
  - "-e"
  - MMF_DOMAIN_ENV_FILE=/mmf-config/domain.env
  # F010 (direct-docker): rviz2_panel controls rviz2 via docker CLI.
  # docker.sock lets rviz2_panel run `docker run/stop/inspect/logs rviz2`.
  # On x86, agl-shell-activator / gRPC :14005 are not present (AGL-only);
  # showRviz2/showHome calls will return a gRPC error (non-fatal, UI stays).
  - "-v"
  - /var/run/docker.sock:/var/run/docker.sock
# rviz2 is not registered with ext-agl on x86 (F010 direct-docker).
# rviz2_panel controls it directly via docker CLI (same as arm64).
# On x86 development, rviz2 can also be run manually:
#   bash apps/docker/script/run-rviz2-x86.sh   (GPU=nvidia|none)
