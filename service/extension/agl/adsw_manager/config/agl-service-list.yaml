services:
- name: adsw_monitor
  service_type: NORMAL
  recovery_policy: ALWAYS
  is_enabled: true
  os_type: AGL
  init_state: NOT_RUNNING
- name: ota_monitor
  service_type: NORMAL
  recovery_policy: R_DEFAULT
  is_enabled: true
  os_type: AGL
  init_state: NOT_RUNNING
- name: lfc_monitor
  service_type: NORMAL
  recovery_policy: R_DEFAULT
  is_enabled: true
  os_type: AGL
  init_state: NOT_RUNNING
- name: hmi_launcher
  service_type: NORMAL
  recovery_policy: R_DEFAULT
  is_enabled: true
  os_type: AGL
  init_state: NOT_RUNNING
  image: registry.obigo.com/oss/oss-hmi-launcher:latest
  extra_args:
  - "-it"
  - --net=host
  - --privileged
  - "-v"
  - /dev:/dev
  - "-v"
  - /run/user/1001:/run/user/1001
  - "-v"
  - /usr/share/flutter:/usr/share/flutter:ro
  - "-v"
  - /tmp/models:/tmp/models:ro
  - "-v"
  - /usr/share/fonts:/usr/share/fonts:ro
  - "-v"
  - /etc/fonts:/etc/fonts:ro
  - "-v"
  - /tmp/fontconfig:/var/cache/fontconfig
  command_args:
  - hmi_launcher
