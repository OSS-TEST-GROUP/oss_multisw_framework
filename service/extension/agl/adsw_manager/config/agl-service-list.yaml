services:
- name: adsw_monitor
  service_type: NORMAL
  recovery_policy: ALWAYS
  is_enabled: true
  mw_type: AGL
  init_state: NOT_RUNNING
- name: ota_monitor
  service_type: NORMAL
  recovery_policy: R_DEFAULT
  is_enabled: true
  mw_type: AGL
  init_state: NOT_RUNNING
- name: lfc_monitor
  service_type: NORMAL
  recovery_policy: R_DEFAULT
  is_enabled: true
  mw_type: AGL
  init_state: NOT_RUNNING
- name: hmi_launcher
  service_type: NORMAL
  recovery_policy: ALWAYS
  is_enabled: true
  mw_type: AGL
  init_state: NOT_RUNNING
  image: registry.obigo.com/oss/oss-hmi-launcher:latest
  extra_args:
  - "-it"
  - --net=host
  - --privileged
  - --restart
  - unless-stopped
  - --cap-add
  - NET_RAW
  - --cap-add
  - NET_ADMIN
  - --device
  - /dev/dri:/dev/dri
  - "-v"
  - /run/user/1001:/run/user/1001
  - "-v"
  - /usr/share/flutter:/usr/share/flutter:ro
  - "-v"
  - /tmp/models:/tmp/models:ro
  - "-v"
  - /usr/share/fonts:/usr/share/fonts:ro
  - "-v"
  - /etc/fonts:/etc/fonts:ro
  - "-v"
  - /root/oss/hmi_launcher_config.json:/etc/hmi_launcher/config.json:rw
  - "-e"
  - HMI_LAUNCHER_CONFIG=/etc/hmi_launcher/config.json
  command_args:
  - hmi_launcher
