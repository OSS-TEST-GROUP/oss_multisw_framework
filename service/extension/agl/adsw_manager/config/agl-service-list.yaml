services:
- name: adsw_monitor
  service_type: NORMAL
  recovery_policy: ALWAYS
  is_enabled: true
  mw_type: AGL
  init_state: NOT_RUNNING
- name: ota_monitor
  service_type: NORMAL
  recovery_policy: R_DEFAULT
  is_enabled: true
  mw_type: AGL
  init_state: NOT_RUNNING
- name: lfc_monitor
  service_type: NORMAL
  recovery_policy: R_DEFAULT
  is_enabled: true
  mw_type: AGL
  init_state: NOT_RUNNING
- name: hmi_launcher
  service_type: NORMAL
  recovery_policy: ALWAYS
  is_enabled: true
  mw_type: AGL
  init_state: NOT_RUNNING
  image: registry.obigo.com/oss/oss-hmi-launcher:latest
  extra_args:
  - "-it"
  - --net=host
  - --privileged
  - --restart
  - unless-stopped
  - --cap-add
  - NET_RAW
  - --cap-add
  - NET_ADMIN
  - --device
  - /dev/dri:/dev/dri
  - "-v"
  - /run/user/1001:/run/user/1001
  - "-v"
  - /usr/share/flutter:/usr/share/flutter:ro
  - "-v"
  - /tmp/models:/tmp/models:ro
  - "-v"
  - /usr/share/fonts:/usr/share/fonts:ro
  - "-v"
  - /etc/fonts:/etc/fonts:ro
  - "-v"
  - /root/oss/hmi_launcher_config.json:/etc/hmi_launcher/config.json:rw
  - "-e"
  - HMI_LAUNCHER_CONFIG=/etc/hmi_launcher/config.json
  command_args:
  - hmi_launcher
# rviz2 (ROS2 Humble / Qt5 / OGRE) — cage(wlroots 키오스크, app_id="wlroots") 컨테이너.
#   컨테이너 소스: oss_hmi_app apps/rviz2_port/docker/agl-display/ (멀티아치 rviz2-agl 이미지).
#   ⚠️ ext-agl 은 `docker run` 만 한다 — agl-shell 활성화는 안 함. 따라서 rviz2 는 기동되나
#      비활성(AGL activate-by-default=false). 표출/홈전환은 agl-shell 스위처가 담당
#      (oss_hmi_app F006: agl-shell-activator -a activate -p wlroots). "상시기동 + activate-swap".
#   소켓: 호스트 /run/user/1001 을 컨테이너 중립경로 /host-xdg 로 마운트(XDG_RUNTIME_DIR=/host-xdg).
#   ⚠️ /run/user/1001 을 컨테이너 동일경로에 직접 마운트하면 컨테이너 /run tmpfs 와 충돌해
#      cage 가 소켓 열기 실패(EINVAL)로 크래시한다 — 실기 검증(2026-07-24)으로 확인.
#   ⚠️ adsw_manager 는 같은 이름 컨테이너를 재사용하므로 extra_args 변경 후엔 기존 rviz2
#      컨테이너를 제거해야 새 인자로 재생성된다. 렌더: llvmpipe(SW).
#   F010: recovery_policy=MANUAL — ext-agl does NOT auto-run or auto-recover rviz2.
#   rviz2_monitor (hmi_launcher 임베드 제어판) 가 ctrl/StartContainer + ctrl/StopContainer 로
#   사용자 의도에 따라 기동/정지를 제어한다. image/extra_args 는 유지하여 StateManager 가
#   ctrl/StartContainer 수신 시 docker-run 방법을 알 수 있게 한다.
- name: rviz2
  service_type: NORMAL
  recovery_policy: MANUAL
  is_enabled: true
  mw_type: AGL
  init_state: NOT_RUNNING
  image: registry.obigo.com/oss/rviz2-agl:latest
  extra_args:
  - --net=host
  - --ipc=host
  - --user
  - 1001:1001
  - --group-add
  - "44"
  - "-v"
  - /run/user/1001:/host-xdg
  - "-e"
  - HOME=/tmp
  - "-e"
  - XDG_RUNTIME_DIR=/host-xdg
  - "-e"
  - WAYLAND_DISPLAY=wayland-0
  - "-e"
  - LIBGL_ALWAYS_SOFTWARE=1
