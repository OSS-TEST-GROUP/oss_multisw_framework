services:
- name: adsw_monitor
  service_type: NORMAL
  recovery_policy: ALWAYS
  is_enabled: true
  mw_type: AGL
  init_state: NOT_RUNNING
- name: ota_monitor
  service_type: NORMAL
  recovery_policy: R_DEFAULT
  is_enabled: true
  mw_type: AGL
  init_state: NOT_RUNNING
- name: lfc_monitor
  service_type: NORMAL
  recovery_policy: R_DEFAULT
  is_enabled: true
  mw_type: AGL
  init_state: NOT_RUNNING
- name: hmi_launcher
  service_type: NORMAL
  recovery_policy: ALWAYS
  is_enabled: true
  mw_type: AGL
  init_state: NOT_RUNNING
  # 기본은 :latest (컨테이너 이미지는 :latest 를 기본 pull 하고, 태그 고정은 옵션).
  # 특정 빌드로 고정해야 하면 이 파일을 복사해 image 를 바꾸고 ADSW_CONFIG 로
  # 마운트한다(재빌드 불필요) — 예: 보드 검증본 develop-20260807-8229899-arm64.
  #
  # ⚠️ 전제: 런처 :latest 가 최신 검증본을 가리켜야 한다. 런처를 새로 빌드하면
  #    :latest 도 함께 갱신할 것 (build_multiarch.sh 는 :latest + 스냅샷을 함께 push).
  #    :latest 가 오래되면 보드가 구 UI 로 되돌아간다.
  image: registry.obigo.com/oss/oss-hmi-launcher:latest
  extra_args:
  - "-it"
  - --net=host
  - --privileged
  - --restart
  - unless-stopped
  - --cap-add
  - NET_RAW
  - --cap-add
  - NET_ADMIN
  - --device
  - /dev/dri:/dev/dri
  - "-v"
  - /run/user/1001:/run/user/1001
  # ── Wayland 연결 + NVIDIA(Tegra) GL 스택 (보드 실측 2026-08-10) ──────────────
  # 이게 없으면 런처는 기동되지만 **화면을 그리지 못한다**:
  #   [INFO] WAYLAND_DISPLAY=                     ← 컴포지터 소켓을 못 찾음
  #   libEGL warning: MESA-LOADER: failed to retrieve device information
  #   libEGL warning: egl: failed to create dri2 screen
  # 원인 두 가지.
  #  (1) 소켓 디렉토리(/run/user/1001)는 마운트돼 있어도 **어느 소켓인지** 알려주지 않으면
  #      flutter-auto 가 agl-compositor 에 붙지 못한다 → XDG_RUNTIME_DIR + WAYLAND_DISPLAY.
  #  (2) `--device /dev/dri` + `--privileged` 는 **커널 노드 접근권**만 준다. 그 노드를
  #      다루는 유저스페이스(libEGL_nvidia, eglcore/glsi/rmapi, libnvrm_*, libnvos, gbm)는
  #      호스트 AGL 이미지에만 있고 컨테이너(ubuntu 베이스)엔 없다 → glvnd 가 벤더를 찾지
  #      못해 **mesa dri2 로 폴백**하고, Tegra 에는 mesa 드라이버가 없어 실패한다.
  #      호스트에서 선별 스테이징한 /opt/nv-gl 을 LD_LIBRARY_PATH 로 물린다.
  #      ⚠️ /usr/lib 를 통째로 걸면 컨테이너 bash 가 보드 libc/vDSO 를 끌어와 깨진다.
  #      스테이징은 AGL 이미지의 oss-integration-compose(oss-nv-gl-stage)가 부팅 시 수행한다.
  - "-e"
  - XDG_RUNTIME_DIR=/run/user/1001
  - "-e"
  - WAYLAND_DISPLAY=wayland-0
  - "-e"
  - LD_LIBRARY_PATH=/opt/nv-gl
  - "-v"
  - /opt/nv-gl:/opt/nv-gl:ro
  # glvnd 벤더 선택(10-nvidia.json) 과 EGL 외부 플랫폼(nvidia wayland/gbm) 설정
  - "-v"
  - /usr/share/glvnd/egl_vendor.d:/usr/share/glvnd/egl_vendor.d:ro
  - "-v"
  - /usr/share/egl/egl_external_platform.d:/usr/share/egl/egl_external_platform.d:ro
  # flutter-auto(AGL 의 Flutter 임베더)는 **호스트 바이너리**를 그대로 쓴다 — 이미지에
  # 넣지 않고 마운트한다(보드 AGL 이미지가 제공, 버전 정합을 호스트에 맡긴다).
  # 없으면 런처가 "flutter-auto 를 찾을 수 없습니다: /usr/bin/flutter-auto" 로 즉시
  # 종료되고 --restart unless-stopped 때문에 재시작을 반복한다(보드 실측 2026-08-06).
  - "-v"
  - /usr/bin/flutter-auto:/usr/bin/flutter-auto:ro
  # Flutter **엔진**만 호스트에서 가져온다(`/usr/share/flutter/<ver>/{release,…}/lib`).
  # ⚠️ 상위 디렉토리(/usr/share/flutter)를 통째로 마운트하면 이미지 안의 **앱 번들**
  #    (/usr/share/flutter/hmi_launcher/<ver>/release)이 가려져 런처가
  #    "번들 디렉토리를 찾을 수 없습니다" 로 죽는다(보드 실측 2026-08-06).
  #    호스트엔 엔진만(3.32.5/…), 이미지엔 번들만(hmi_launcher/3.32.5/…) 있으므로
  #    버전 디렉토리만 정확히 겹쳐 준다. Flutter 버전 상향 시 이 경로도 함께 올린다.
  - "-v"
  - /usr/share/flutter/3.32.5:/usr/share/flutter/3.32.5:ro
  # /tmp/models 마운트 제거 (2026-08-11) — 런처(Flutter) 코드에 이 경로 참조가 **없다**
  # (LauncherBot 온디바이스 모델용으로 예정만 해둔 자리. 현재 aiAvailable=false).
  # /tmp 는 tmpfs 라 부팅마다 비고, 소스가 없으면 Docker 가 root 소유 디렉토리를 자동
  # 생성해 예측 불가 상태를 만든다. 실제로 모델을 쓰게 되면 영속 경로(예: /opt/oss/models)로
  # 다시 추가한다.
  - "-v"
  - /usr/share/fonts:/usr/share/fonts:ro
  - "-v"
  - /etc/fonts:/etc/fonts:ro
  - "-v"
  - /root/oss/hmi_launcher_config.json:/etc/hmi_launcher/config.json:rw
  - "-e"
  - HMI_LAUNCHER_CONFIG=/etc/hmi_launcher/config.json
  # 런처의 사용자 설정(앱 표시/숨김 = app_visibility.json, 타임존 등)은
  # XDG_CONFIG_HOME 아래에 저장된다. 미설정이면 HOME(/tmp)으로 떨어져
  # **컨테이너 재생성마다 초기화**된다 → 기본 숨김 앱(ota_monitor, rviz2_panel)을
  # 켜 놓아도 재부팅하면 다시 사라진다(보드 실측). 호스트 디렉토리로 영속화한다.
  # ⚠️ 이 디렉토리는 **런처 uid(1001, agl-driver) 소유**여야 한다. root 소유면
  #    flutter-auto 가 XDG_CONFIG_HOME 하위 디렉토리 생성에 실패해
  #    "create_directories: Permission denied" 로 앱이 죽는다(보드 실측).
  #      mkdir -p /root/oss/hmi_launcher_cfg && chown -R 1001:1001 /root/oss/hmi_launcher_cfg
  - "-v"
  - /root/oss/hmi_launcher_cfg:/cfg:rw
  - "-e"
  - XDG_CONFIG_HOME=/cfg
  # DDS 도메인 정본 파일. 런처 Settings 의 "DDS domain"(기본 42)이 여기에 기록하고,
  # run-mmf.sh / run-ext-agl.sh / docker compose 가 기동 시 읽는다 → 변경은 **다음
  # 기동 때** 반영된다(ROS_DOMAIN_ID 는 프로세스 시작 시에만 읽힘).
  # ⚠️ 호스트 디렉토리는 런처 uid(1001, agl-driver) 가 쓸 수 있어야 한다:
  #      mkdir -p /opt/mmf/config && chown -R 1001:1001 /opt/mmf/config
  #    (권한이 없으면 런처는 설정만 저장하고 스낵바로 파일 쓰기 실패를 알린다)
  - "-v"
  - /opt/mmf/config:/mmf-config:rw
  - "-e"
  - MMF_DOMAIN_ENV_FILE=/mmf-config/domain.env
  # F010 (direct-docker): rviz2_panel (inside hmi_launcher) controls the
  # rviz2 container directly via the docker CLI + AGL shell gRPC (:14005).
  # docker.sock lets rviz2_panel run `docker run/stop/inspect/logs rviz2`.
  # Screen switching (showRviz2 / showHome) goes through the agl-shell gRPC
  # service at 127.0.0.1:14005 using --net=host (no activator binary needed).
  - "-v"
  - /var/run/docker.sock:/var/run/docker.sock
  # The container runs as uid 1001, but docker.sock is owned by root:docker.
  # Add the host `docker` group gid (999 on this Orin board — verify with
  # `stat -c %g /var/run/docker.sock`) so rviz2_panel can talk to the daemon.
  - --group-add
  - "999"
  command_args:
  - hmi_launcher
  # ── 배경(BG) 롤로 띄운다 — **가로 1920x1080 출력에서는 이것만 동작한다** ─────────
  # (2026-08-13 Orin AGX 보드 실측, 3가지 조합 전수 확인)
  #
  # AGL 홈스크린(flutter-ics-homescreen)은 AGL 레퍼런스의 **세로 1080x1920** 화면
  # 전용이다. 실행 중이면 컴포지터가 NORMAL 앱에 주는 activation area 를 세로 기준
  # `1080x1712`(=1920-208 패널) 로 고정한다. 그래서 가로 출력 보드에서는:
  #   · 창 인자 없이 NORMAL → 화면 **좌측 1080px 만** 그리고 우측엔 홈스크린이 남는다
  #   · agl-run.sh 가 SetAppFullscreen 을 부르면 →
  #     `xdg_surface geometry (1080 x 1712) is larger than the configured
  #      fullscreen state (1920 x 1080)` 프로토콜 에러로 **런처가 종료**된다(기동 +15초)
  #   · flutter-auto 의 `-f/--fullscreen`, `-w/-h` 로는 못 고친다 — 창 기하는
  #     클라이언트가 정하지 못하고 agl-shell 이 소유한다
  #   · 홈스크린을 끄고 NORMAL 로 두면 → BG surface 가 없어 **완전 검은 화면**
  #   · 홈스크린 OFF + `--window-type BG` → ✅ 1920x1080 전체 표출 (재부팅 후에도 유지)
  #
  # 전제: **flutter-ics-homescreen 을 비활성화**해야 한다. 둘 다 BG 를 요구하면 agl_shell
  # 셸 클라이언트 슬롯을 다퉈 양쪽이 크래시 루프에 빠진다
  # (`agl_shell extension already in use by other shell client`). 이미 다퉜다면 슬롯이
  # 죽은 클라이언트에 잡혀 있으니 `systemctl restart agl-compositor` 로 비운다.
  # Yocto 이미지에서는 meta-oss 의 flutter-ics-homescreen bbappend
  # (`SYSTEMD_AUTO_ENABLE = "disable"`) 가 이 전제를 만든다.
  #
  # ⚠️ 남은 트레이드오프: BG 롤에서는 rviz2 실행 중 런처가 **터치를 받지 못해** 패널로
  #    rviz2 를 정지할 수 없다(입력 포커스가 cage 에 남는다 — 보드 실측).
  #    rviz2 워크플로가 필요하면 이 구성을 재검토해야 한다. 근거:
  #    oss_hmi_app/docs/rviz2/board-launcher-fullscreen-guide.md 4절
  - --window-type
  - BG
# homebar (홈 버튼 오버레이)는 **더 이상 별도 서비스가 아니다** — rviz2 컨테이너에
# 통합됐다(apps/rviz2_port/docker/agl-display: Dockerfile.touch 가 homebar 바이너리와
# grpcurl 을 함께 담고, entrypoint 가 cage 와 함께 띄운다).
# 이유: homebar 는 cage 와 무관한 호스트 agl-compositor 의 일반 Wayland 클라이언트라
# rviz2 와 같은 컨테이너에서 돌려도 동작이 같고, 생명주기가 일치해(버튼은 rviz2 가
# 살아있는 동안만 존재) 부팅 시 show/hide 경합과 스테일 서페이스가 사라진다.
# rviz2 자체도 adsw 관리 대상이 아니다(아래 참조) → homebar 서비스 정의 제거.
# rviz2 is no longer managed by ext-agl / adsw_manager (F010 direct-docker).
# rviz2_panel (embedded in hmi_launcher) controls the rviz2 container
# directly via `docker run/stop/inspect/logs` + AGL shell gRPC :14005.
# The rviz2 entry has been REMOVED from this file.
